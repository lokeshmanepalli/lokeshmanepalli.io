<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

*{
margin:0;
padding:0;
box-sizing:border-box;
scroll-behavior:smooth;
}

:root{
--bg:#030712;
--card:rgba(255,255,255,.06);
--glass:rgba(255,255,255,.04);
--border:rgba(255,255,255,.12);

--text:#ffffff;
--muted:#a6b3c8;

--blue:#60a5fa;
--cyan:#22d3ee;
--purple:#8b5cf6;

--shadow:
0 8px 32px rgba(0,0,0,.35);

--glow:
0 0 40px rgba(34,211,238,.18);

--radius:26px;
}

body{

font-family:'Inter',sans-serif;

color:var(--text);

background:

radial-gradient(
circle at 0% 0%,
rgba(139,92,246,.15),
transparent 35%
),

radial-gradient(
circle at 100% 0%,
rgba(34,211,238,.18),
transparent 35%
),

radial-gradient(
circle at 50% 100%,
rgba(96,165,250,.12),
transparent 35%
),

linear-gradient(
180deg,
#030712,
#08111f,
#050914
);

overflow-x:hidden;
}


body::before{

content:"";

position:fixed;

width:100%;
height:100%;

pointer-events:none;

background:

linear-gradient(
transparent 98%,
rgba(255,255,255,.02)
);

background-size:100% 35px;

opacity:.4;
}


a{
color:var(--cyan);
text-decoration:none;
}

header{

position:sticky;
top:0;
z-index:1000;

background:
rgba(3,7,18,.55);

backdrop-filter:
blur(25px);

border-bottom:
1px solid rgba(255,255,255,.08);

box-shadow:
0 8px 30px rgba(0,0,0,.25);
}


nav{

max-width:1200px;

margin:auto;

padding:18px 30px;

display:flex;

justify-content:space-between;

align-items:center;
}


nav h1{

font-size:1.3rem;

font-weight:700;

background:
linear-gradient(
90deg,
#fff,
#60a5fa,
#22d3ee
);

-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}


nav ul{

display:flex;
gap:24px;
list-style:none;
}


nav ul li a{

color:#dbeafe;

transition:.4s;
position:relative;
}

nav ul li a:hover{

color:white;
}

nav ul li a::after{

content:"";

position:absolute;

bottom:-6px;
left:0;

width:0%;
height:2px;

background:linear-gradient(
90deg,
var(--blue),
var(--cyan)
);

transition:.4s;
}

nav ul li a:hover::after{

width:100%;
}


.hero{

max-width:1200px;

margin:auto;

padding:100px 30px;

display:grid;

grid-template-columns:1.2fr .8fr;

gap:40px;

align-items:center;
}


.hero-text h2{

font-size:4rem;

line-height:1.1;

margin-bottom:18px;

font-weight:800;

background:
linear-gradient(
90deg,
#ffffff,
#60a5fa,
#22d3ee
);

-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}


.hero-text h3{

color:#8ddcff;
margin-bottom:20px;
}


.hero-text p{

color:var(--muted);

font-size:1.08rem;

max-width:700px;
}


.btn{

padding:14px 26px;

border-radius:999px;

font-weight:700;

display:inline-block;

transition:.4s;
}


.btn-primary{

background:
linear-gradient(
135deg,
#60a5fa,
#22d3ee
);

color:black;

box-shadow:
0 0 30px rgba(34,211,238,.3);
}

.btn-primary:hover{

transform:
translateY(-5px);

box-shadow:
0 0 45px rgba(34,211,238,.5);
}


.btn-secondary{

background:rgba(255,255,255,.05);

border:1px solid rgba(255,255,255,.12);

color:white;
}

.btn-secondary:hover{

background:rgba(255,255,255,.08);

transform:
translateY(-5px);
}


.hero-card,
.card,
.timeline-item,
.publication-item,
.photo-card{

background:
rgba(255,255,255,.05);

border:
1px solid rgba(255,255,255,.08);

backdrop-filter:
blur(22px);

border-radius:
var(--radius);

box-shadow:
var(--shadow);

transition:.5s;
}


.hero-card:hover,
.card:hover,
.timeline-item:hover,
.publication-item:hover,
.photo-card:hover{

transform:
translateY(-8px);

box-shadow:
var(--shadow),
var(--glow);

border-color:
rgba(34,211,238,.35);
}


section{

max-width:1200px;

margin:auto;

padding:60px 30px;
}


.section-title{

font-size:2.3rem;

margin-bottom:30px;

font-weight:700;

position:relative;
}


.section-title::after{

content:"";

position:absolute;

left:0;
bottom:-10px;

width:80px;
height:4px;

border-radius:10px;

background:
linear-gradient(
90deg,
#60a5fa,
#22d3ee
);
}


.card-grid{

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(300px,1fr));

gap:24px;
}


.tag,
.skill-pill{

padding:10px 15px;

border-radius:999px;

background:
rgba(96,165,250,.08);

border:
1px solid rgba(96,165,250,.15);

transition:.3s;
}

.tag:hover,
.skill-pill:hover{

transform:
scale(1.05);

background:
rgba(34,211,238,.14);
}


footer{

margin-top:60px;

padding:35px;

text-align:center;

background:
rgba(0,0,0,.35);

border-top:
1px solid rgba(255,255,255,.08);
}


@media(max-width:900px){

.hero{

grid-template-columns:1fr;
}

nav{

flex-direction:column;
gap:20px;
}

.hero-text h2{

font-size:2.8rem;
}
}

</style>
